<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PIXELON – Edit. Create. Dominate.</title>
<style>
:root{--bg:#04070f;--panel:#0a1224;--line:#15305c;--text:#e6efff;--mute:#8aa0c4;--neon:#1ea7ff;--glow:rgba(30,167,255,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Segoe UI",system-ui,sans-serif;overflow-x:hidden}
canvas#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.18;pointer-events:none}
#glow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:0;transform:translate(-50%,-50%);left:50%;top:30%;opacity:.35}
main,header,footer{position:relative;z-index:1}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(4,7,15,.8);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font:800 20px/1 "Trebuchet MS",sans-serif;letter-spacing:.22em;color:var(--text);text-decoration:none;text-shadow:0 0 14px var(--neon)}
nav{display:flex;gap:18px;align-items:center}
nav a{color:var(--mute);text-decoration:none;font-size:14px}
nav a:hover,nav a:focus-visible{color:var(--neon)}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:var(--mute);padding:6px 10px;font-size:13px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--neon);color:#001226;font-weight:700}
@media(max-width:720px){nav a{display:none}}
section{padding:72px 20px;max-width:1040px;margin:0 auto}
.hero{min-height:82vh;display:flex;flex-direction:column;justify-content:center}
h1{font:800 clamp(48px,14vw,128px)/.95 "Trebuchet MS",sans-serif;letter-spacing:.06em;margin:0;color:#fff;text-shadow:0 0 22px var(--neon),0 0 60px var(--glow)}
.slogan{font-size:clamp(18px,4vw,26px);color:var(--neon);margin:18px 0 10px;letter-spacing:.04em}
.lead{max-width:560px;color:var(--mute)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-block;padding:13px 24px;border-radius:8px;border:1px solid var(--neon);color:var(--text);text-decoration:none;font-weight:600;background:none;cursor:pointer;font-size:16px;min-height:44px}
.btn.main{background:var(--neon);color:#001226;box-shadow:0 0 24px var(--glow)}
.btn:hover,.btn:focus-visible{box-shadow:0 0 28px var(--glow)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
h2{font-size:clamp(26px,5vw,38px);margin:0 0 28px}
.panel{background:linear-gradient(160deg,rgba(14,28,56,.85),rgba(8,14,30,.85));border:1px solid var(--line);border-radius:14px;padding:24px}
.reel{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mute);border-style:dashed}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.pack{transition:transform .2s,box-shadow .2s}
.pack:hover{transform:translateY(-4px);box-shadow:0 0 30px var(--glow)}
.pack.hot{border-color:var(--neon);box-shadow:0 0 24px var(--glow)}
.price{font-size:38px;font-weight:800;color:var(--neon);margin:6px 0}
.pack p{color:var(--mute);margin:0 0 16px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:block;color:var(--neon);font-weight:800;font-size:26px}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font-weight:600}
details p{color:var(--mute);margin:10px 0 0}
form{display:grid;gap:12px;max-width:520px}
label{font-size:14px;color:var(--mute)}
input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:#060d1c;color:var(--text);font:inherit;margin-top:4px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
#msg{color:var(--neon);min-height:1.4em}
footer{border-top:1px solid var(--line);padding:28px 20px;text-align:center;color:var(--mute);font-size:14px}
.own-p{position:fixed;left:0;right:0;bottom:0;max-height:78vh;overflow:auto;z-index:9;background:#050b18;border-top:1px solid var(--neon);padding:18px 20px calc(70px + env(safe-area-inset-bottom,0px))}.own-p label{display:block;margin-bottom:10px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.pack{transition:none}html{scroll-behavior:auto}}
</style>
