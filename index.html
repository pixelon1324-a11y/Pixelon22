}else{document.querySelectorAll(".rv").forEach(function(e){e.classList.add("in")})}
var glow=document.getElementById("glow");
if(!reduce)window.addEventListener("pointermove",function(e){glow.style.left=e.clientX+"px";glow.style.top=e.clientY+"px"},{passive:true});
var canvas=document.getElementById("net"),ctx=canvas.getContext?canvas.getContext("2d"):null,points=[],W=0,H=0;
function resizeCanvas(){
if(!ctx)return;
var dpr=Math.min(window.devicePixelRatio||1,2);
W=window.innerWidth;H=window.innerHeight;
canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);
ctx.setTransform(dpr,0,0,dpr,0,0);points=[];
var count=Math.min(60,Math.floor(W*H/22000));
for(var i=0;i<count;i++)points.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35});
}
function drawNetwork(){
if(!ctx)return;
ctx.clearRect(0,0,W,H);
for(var i=0;i<points.length;i++){
var p=points[i];
if(!reduce){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
ctx.fillStyle="#1ea7ff";ctx.fillRect(p.x,p.y,2,2);
for(var j=i+1;j<points.length;j++){
var q=points[j],d=Math.hypot(p.x-q.x,p.y-q.y);
if(d<140){ctx.strokeStyle="rgba(30,167,255,"+(1-d/140)*.35+")";ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke()}
}
}
if(!reduce)requestAnimationFrame(drawNetwork);
}
window.addEventListener("resize",function(){resizeCanvas();if(reduce)drawNetwork()});
resizeCanvas();drawNetwork();
</script>
<script src="account.js"></script>
</body>
</html>
